# ============================================================
# Splunk Universal Forwarder Configuration
# Files: inputs.conf + outputs.conf
# ============================================================

# ============================================================
# OUTPUTS.CONF
# Location:
#   Linux : $SPLUNK_HOME/etc/system/local/outputs.conf
#   Windows: C:\Program Files\SplunkUniversalForwarder\etc\system\local\outputs.conf
# ============================================================

[tcpout]
defaultGroup = splunk_indexer

[tcpout:splunk_indexer]
# Replace with your Splunk Enterprise server IP
server = YOUR_SPLUNK_SERVER_IP:9997
compressed = true

# ============================================================
# INPUTS.CONF - LINUX (Ubuntu Desktop)
# Location: $SPLUNK_HOME/etc/system/local/inputs.conf
# ============================================================

# Monitor syslog
[monitor:///var/log/syslog]
index = linux_logs
sourcetype = syslog

# Monitor auth logs (login attempts, sudo, SSH)
[monitor:///var/log/auth.log]
index = linux_logs
sourcetype = linux_secure

# Monitor system messages
[monitor:///var/log/messages]
index = linux_logs
sourcetype = syslog

# Monitor Snort alerts (if Snort is running)
[monitor:///var/log/snort/alert]
index = ids_logs
sourcetype = snort_alert

# ============================================================
# INPUTS.CONF - WINDOWS (Windows 11)
# Location: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
# ============================================================

# Monitor Windows Security Event Log
[WinEventLog://Security]
index = windows_logs
sourcetype = WinEventLog:Security
disabled = false

# Monitor Windows System Event Log
[WinEventLog://System]
index = windows_logs
sourcetype = WinEventLog:System
disabled = false

# Monitor Windows Application Event Log
[WinEventLog://Application]
index = windows_logs
sourcetype = WinEventLog:Application
disabled = false

# Monitor Windows PowerShell logs
[WinEventLog://Microsoft-Windows-PowerShell/Operational]
index = windows_logs
sourcetype = WinEventLog:PowerShell
disabled = false

# ============================================================
# HOW TO APPLY CONFIG
# ============================================================

# Linux:
# sudo cp outputs.conf $SPLUNK_HOME/etc/system/local/
# sudo cp inputs.conf $SPLUNK_HOME/etc/system/local/
# sudo $SPLUNK_HOME/bin/splunk restart

# Windows (run as Administrator):
# copy outputs.conf "C:\Program Files\SplunkUniversalForwarder\etc\system\local\"
# copy inputs.conf "C:\Program Files\SplunkUniversalForwarder\etc\system\local\"
# & "C:\Program Files\SplunkUniversalForwarder\bin\splunk.exe" restart

# ============================================================
# VERIFY FORWARDER CONNECTION
# ============================================================

# On Splunk Enterprise:
# Settings → Forwarding and Receiving → Review connected forwarders

# SPL to verify logs are coming in:
# index=linux_logs | head 10
# index=windows_logs | head 10
